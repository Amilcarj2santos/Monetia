<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monetia — Rescate de datos</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eef2f7;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box}
.card{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,0.12);max-width:440px;width:100%;padding:30px 26px;text-align:center}
h1{font-size:20px;margin:0 0 6px}
p{font-size:14px;line-height:1.6;color:#475569;margin:10px 0}
.big{display:block;width:100%;padding:16px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px}
.count{font-size:15px;font-weight:700;margin-top:12px}
.ok{color:#059669}.bad{color:#dc2626}
.note{font-size:12px;color:#94a3b8;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <h1>🛟 Monetia — Rescate de datos</h1>
  <p>Esta página <b>no se conecta a internet ni a la nube</b>. Solo lee los datos de Monetia guardados en este dispositivo y los descarga como archivo de respaldo.</p>
  <div class="count" id="status">Leyendo datos…</div>
  <button class="big" id="btn" style="display:none">⬇️ Descargar respaldo</button>
  <p class="note">Después de descargar, guarda o comparte el archivo (por email o WhatsApp) y avisa. No borres nada.</p>
</div>
<script>
(function(){
  var status=document.getElementById('status'), btn=document.getElementById('btn');
  var store={}, n=0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf('finz_')===0 && k!=='finz_sess_persist_v1'){ store[k]=localStorage.getItem(k); n++; }
    }
  }catch(e){}
  var tx=[]; try{ tx=JSON.parse(store['finz_tx_v4']||'[]')||[]; }catch(e){}
  var P=function(k){ try{ return JSON.parse(store[k]); }catch(e){ return undefined; } };
  if(n===0){
    status.className='count bad';
    status.textContent='No se encontraron datos de Monetia en este dispositivo.';
    return;
  }
  status.className='count ok';
  status.textContent='✓ Datos encontrados: '+tx.length+' movimientos, '+n+' claves guardadas.';
  btn.style.display='block';
  btn.onclick=function(){
    var backup={ v:7, ts:new Date().toISOString(), rescue:true, store:store,
      tx:tx, accounts:P('finz_acc_v1'), debts:P('finz_debt_v1'), receivables:P('finz_recv_v1'),
      budget:P('finz_bud_v1'), cfg:P('finz_cfg_v1'), users:P('finz_users_v1'), people:P('finz_people_v1') };
    var blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url;
    a.download='patrimonio_backup_RESCATE_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },5000);
    status.textContent='✓ Respaldo descargado. Guárdalo y avísale a Amílcar.';
  };
})();
</script>
</body>
</html>
